<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>로봇 해커톤 연습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: toy-box mission board — LEGO-stud dotted ground, chunky ink-outlined cards, one focused column; student sees only today's missions */
:root{
  --bg:#EEF1F8; --stud:rgba(36,30,90,.07); --surface:#FFFFFF; --sunk:#F4F5FB; --ink:#211C52; --edge:#211C52; --muted:#5E5A86; --line:#D8DBEA;
  --accent:#FFC72C; --accent-ink:#211C52; --coral:#FF6B4A; --teal:#12A38A; --sky:#3D7BFF; --grape:#8A5CF6; --pink:#EC4F94; --orange:#FF9419;
  --good:#12A38A; --warn:#C27400; --bad:#E0452B;
  --shadow:0 3px 0 var(--line);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --b-event:#F5C400; --b-control:#FFAB19; --b-move:#E8508F; --b-motor:#1E88E5; --b-light:#8E63F2;
  --b-sound:#C25BC2; --b-sensor:#3FA3CC; --b-op:#4CAF50; --b-var:#F57C1F; --b-husky:#16A085;
  --hub:#F4F4EE; --hub-edge:#C9CBBF; --hubport:#2A2F3A; --matrix:#1D2333; --lit:#FFD84D;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141230; --stud:rgba(255,255,255,.045); --surface:#211E44; --sunk:#1A1838; --ink:#EEEBFF; --edge:#06050F; --muted:#A9A5CF; --line:#36325F;
  --coral:#FF8063; --teal:#2FC8AC; --sky:#6F9BFF; --grape:#A584FF; --pink:#FF73AE; --orange:#FFAA45;
  --good:#2FC8AC; --warn:#F2A93B; --bad:#FF7A5C; --shadow:0 3px 0 #0b0a1d;
  --hub:#D9DBD2; --hub-edge:#9EA196; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141230; --stud:rgba(255,255,255,.045); --surface:#211E44; --sunk:#1A1838; --ink:#EEEBFF; --edge:#06050F; --muted:#A9A5CF; --line:#36325F;
  --coral:#FF8063; --teal:#2FC8AC; --sky:#6F9BFF; --grape:#A584FF; --pink:#FF73AE; --orange:#FFAA45;
  --good:#2FC8AC; --warn:#F2A93B; --bad:#FF7A5C; --shadow:0 3px 0 #0b0a1d;
  --hub:#D9DBD2; --hub-edge:#9EA196; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(circle at 14px 14px,var(--stud) 6px,transparent 6.5px);background-size:28px 28px;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0;word-break:keep-all}
p{margin:.4em 0}
b{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
a{color:var(--sky)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.small{font-size:.86rem;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:2px solid var(--edge)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.3rem}
.brand small{display:block;font-family:var(--f-body);font-size:.76rem;color:var(--muted);line-height:1.2}
.spacer{flex:1}
.who-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;border:2px solid var(--edge);background:var(--surface);text-decoration:none;color:inherit;font-weight:700;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;color:#211C52;border:2px solid var(--edge);flex:none}
.av.m0{background:#FFD84D}.av.m1{background:#8FE3CF}.av.m2{background:#FFB3C7}.av.mt{background:#B8C8FF}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.shared i{background:var(--good)}
.minitimer{display:flex;align-items:center;gap:8px;padding:3px 10px;border-radius:12px;background:var(--sunk);border:2px solid var(--edge);text-decoration:none;color:inherit}
.minitimer .st{font-size:.8rem;color:var(--muted);max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minitimer .tm{font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.minitimer.over .tm{color:var(--bad)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:700;font-size:.95rem;border:2px solid transparent}
nav.tabs a[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--edge)}
nav.tabs a:hover{color:var(--ink)}

main{padding-block:22px 80px}
.view{display:grid;gap:18px}

/* building blocks */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.panel h3{font-size:1.3rem;margin-bottom:6px}
.toy{background:var(--surface);border:2px solid var(--edge);border-radius:20px;box-shadow:4px 4px 0 var(--edge);padding:18px;min-width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{font-size:1.25rem;margin-bottom:6px}
.pagehead h2{font-size:2rem}
.lede{color:var(--muted);max-width:66ch;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--edge);background:var(--surface);padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);box-shadow:2px 2px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:10px}
.btn.big{padding:13px 26px;font-size:1.1rem;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good);color:var(--ink)}
.tag.need{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-color:var(--warn);color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));border-color:var(--bad);color:var(--ink)}
.note{font-size:.9rem;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.callout{background:var(--sunk);border-left:5px solid var(--sky);border-radius:10px;padding:10px 14px;margin:.6em 0}
.callout.warn{border-left-color:var(--warn)}
.callout b:first-child{margin-right:6px}
.bul{margin:.4em 0;padding-left:1.2em;display:grid;gap:4px}
.steps{margin:.4em 0;padding-left:1.4em;display:grid;gap:5px}
ul.check{list-style:none;padding:0;display:grid;gap:6px}
ul.check li::before{content:"";display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-radius:4px;margin-right:8px;vertical-align:-2px}
.tbl{border-collapse:collapse;width:100%;margin:.5em 0;font-size:.93rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:700}
.tblwrap{overflow-x:auto}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:.6em 0}
.duo>div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.duo>div.no{border-color:var(--bad)}
.duo span{font-size:.93rem}
.pat{display:grid;gap:8px;margin:.6em 0}
.pat>div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.banner{background:var(--ink);color:var(--surface);border-radius:16px;padding:14px 18px;display:grid;gap:2px;margin:.4em 0;border:2px solid var(--edge)}
.banner span{font-size:.74rem;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.banner b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.2}
.banner em{font-style:normal;opacity:.88}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rule{border-radius:12px;padding:10px 12px;display:grid;gap:3px;border:2px solid var(--line);background:var(--sunk)}
.rule.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.rule.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.rule span{font-size:.9rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kv>div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv h4{margin:0 0 4px;font-family:var(--f-body);font-weight:700;font-size:.8rem;letter-spacing:.04em;color:var(--muted)}
label.f{display:grid;gap:4px;font-weight:700;font-size:.93rem}
label.f .h,.fh{color:var(--muted);font-weight:400;font-size:.82rem}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--sky);outline:none}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--edge)}
.chip.h[aria-pressed="true"]{background:var(--b-husky);border-color:var(--b-husky);color:#fff}
.bar{height:12px;border-radius:99px;background:var(--sunk);border:2px solid var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.teal>span{background:var(--teal)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:18px;background:var(--surface)}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.q-opt{text-align:left;border:2px solid var(--edge);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--edge);font-weight:500}
.q-opt:hover:not(:disabled){background:var(--sunk)}
.q-opt.right{background:color-mix(in srgb,var(--good) 22%,var(--surface))}
.q-opt.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.q-opt:disabled{cursor:default}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sunk);border-left:5px solid var(--accent)}
.pdots{display:flex;gap:4px;flex-wrap:wrap}
.pdots i{width:24px;height:8px;border-radius:4px;background:var(--line)}
.pdots i.ok{background:var(--good)} .pdots i.no{background:var(--bad)} .pdots i.cur{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:14px;z-index:20;font-size:.95rem;border:2px solid var(--edge);max-width:calc(100% - 32px)}

/* who screen */
.whogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.whobtn{display:grid;justify-items:center;gap:10px;padding:22px 12px;border-radius:20px;border:2px solid var(--edge);box-shadow:4px 4px 0 var(--edge);background:var(--surface);cursor:pointer;font-family:var(--f-display);font-size:1.4rem;color:var(--ink)}
.whobtn .av{width:64px;height:64px;font-size:1.8rem;border-width:3px}
.whobtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}

/* student home */
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:600px){.hello{grid-template-columns:1fr}}
.hello h2{font-size:2.3rem}
.dday{display:grid;justify-items:center;padding:12px 18px;border-radius:18px;background:var(--ink);color:var(--surface);border:2px solid var(--edge);box-shadow:4px 4px 0 var(--accent)}
.dday b{font-family:var(--f-display);font-weight:400;font-size:2.2rem;line-height:1;color:var(--accent)}
.dday span{font-size:.8rem}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h3{font-size:1.5rem}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mcard{position:relative;display:grid;gap:8px;align-content:start;padding:0;border-radius:20px;border:2px solid var(--edge);box-shadow:5px 5px 0 var(--edge);background:var(--surface);text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .1s}
.mcard:hover{transform:translate(-1px,-1px)}
.mcard .band{background:var(--pc);padding:14px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--edge);color:#211C52}
.mcard .band svg{flex:none}
.mcard .band .ph{font-weight:700;font-size:.82rem}
.mcard .body{padding:6px 16px 16px;display:grid;gap:6px}
.mcard h4{font-size:1.35rem}
.mcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mcard .go{justify-self:start;margin-top:4px}
.mcard.done{opacity:.92}
.stamp{position:absolute;right:10px;top:46px;transform:rotate(-12deg);border:3px solid var(--bad);color:var(--bad);border-radius:12px;padding:2px 10px;font-family:var(--f-display);font-size:1.3rem;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.mrow:hover{border-color:var(--edge)}
.mrow .dot{width:14px;height:14px;border-radius:50%;background:var(--pc);border:2px solid var(--edge)}
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.jstep{display:grid;justify-items:center;gap:6px;text-align:center;padding:10px 6px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.jstep .ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--edge);background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--sunk) 0)}
.jstep .ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem}
.jstep b{font-size:.84rem}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.stp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:8px;font-size:.72rem;font-weight:700;border:3px dashed var(--pc);color:var(--ink);background:color-mix(in srgb,var(--pc) 16%,var(--surface));transform:rotate(var(--r));word-break:keep-all;line-height:1.2}

/* player */
.ptop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ptop h2{font-size:1.9rem}
.phase-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;border-radius:999px;background:var(--pc);color:#211C52;font-weight:700;font-size:.85rem;border:2px solid var(--edge)}
.donebox{display:grid;justify-items:center;gap:8px;text-align:center;padding:26px 16px;border-radius:22px;border:2px solid var(--edge);box-shadow:5px 5px 0 var(--edge);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.donebox .big{font-family:var(--f-display);font-size:2.6rem;color:var(--good);border:4px solid var(--good);border-radius:18px;padding:2px 22px;transform:rotate(-6deg);animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(2) rotate(-6deg);opacity:0}70%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.lcontent{font-size:1.04rem}
.lcontent h3{font-size:1.65rem;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:30px;height:10px;border-radius:5px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.on{background:var(--accent);outline:2px solid var(--edge)}
.dots button.seen{background:var(--teal)}
.try{margin-top:14px;border:2px dashed var(--b-husky);border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--b-husky) 8%,var(--surface))}
.try b{color:var(--b-husky)}
.widget{margin-top:12px}
.preview-note{background:color-mix(in srgb,var(--sky) 14%,var(--surface));border:2px solid var(--sky);border-radius:12px;padding:8px 14px;font-size:.9rem}

/* teacher */
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tstat{border-radius:16px;border:2px solid var(--edge);background:var(--surface);padding:12px 14px;box-shadow:3px 3px 0 var(--edge)}
.tstat b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:4px;font-size:.82rem}
.matrix th{font-weight:700;text-align:left;white-space:nowrap;padding:2px 6px;color:var(--muted);vertical-align:bottom}
.matrix th.act{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;font-weight:500;color:var(--ink)}
.matrix td{width:30px;height:30px;text-align:center;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-weight:700}
.matrix td.y{background:var(--good);color:#fff;border-color:var(--good)}
.matrix td.n{background:color-mix(in srgb,var(--bad) 22%,var(--surface));border-color:var(--bad)}
.matrix td.w{background:var(--sunk)}
.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
@media (max-width:560px){.day{grid-template-columns:1fr}}
.day.today{border-color:var(--edge);box-shadow:3px 3px 0 var(--accent)}
.day.past{opacity:.75}
.day .dl{font-family:var(--f-display);font-size:1.2rem;line-height:1.2}
.day .dl small{display:block;font-family:var(--f-body);font-size:.78rem;color:var(--muted)}
.achips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.achip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:10px;background:color-mix(in srgb,var(--pc) 22%,var(--surface));border:2px solid var(--pc);font-size:.88rem}
.achip .tw{font-size:.72rem;font-weight:700;padding:0 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.achip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;padding:0 4px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:6px;margin-top:8px}
@media (max-width:560px){.addrow{grid-template-columns:1fr}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.subs{display:grid;gap:10px}
.sub{border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 14px;display:grid;gap:4px}

/* widgets */
.hubwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:640px){.hubwrap{grid-template-columns:1fr}}
.hubwrap svg{width:100%;max-width:340px;justify-self:center}
.hot{cursor:pointer}
.hot:hover>*,.hot.on>*{stroke:var(--sky);stroke-width:3}
.infobox{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:120px}
.infobox h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kitc{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px;cursor:pointer;text-align:left;display:grid;gap:4px;align-content:start}
.kitc svg{width:100%;height:58px}
.kitc .q{font-size:.85rem;color:var(--muted)}
.kitc[aria-pressed="true"]{background:var(--surface);border-color:var(--accent)}
.io{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;justify-self:start}
.io.in{background:color-mix(in srgb,var(--sky) 20%,var(--surface))}
.io.out{background:color-mix(in srgb,var(--coral) 20%,var(--surface))}
.io.ai{background:var(--b-husky);color:#fff}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:640px){.sim{grid-template-columns:1fr}}
.sim .vis{display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:170px}
.big-read{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.press{width:120px;height:120px;border-radius:50%;border:4px solid var(--ink);background:var(--sunk);cursor:pointer;font-weight:700;touch-action:none;user-select:none}
.press.on{background:var(--accent)}
.ipo{display:grid;gap:10px}
.ipo-pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.ipo-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.ipo-bins{grid-template-columns:1fr}}
.bin{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:110px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--sunk)}
.bin h5{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.bin .chip{cursor:default}
.chip.sel{outline:3px solid var(--accent)}
.chip.right{border-color:var(--good)} .chip.wrong{border-color:var(--bad);text-decoration:line-through}
.husky{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:680px){.husky{grid-template-columns:1fr}}
.hl-dev{background:#1b1f27;border-radius:16px;padding:12px;color:#e8ecf2;display:grid;gap:10px}
.hl-screen{background:#0b0e13;border-radius:10px;aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;max-width:100%}
.hl-screen .fn{position:absolute;top:6px;left:8px;font-size:.78rem;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:6px}
.hl-screen .ml{position:absolute;top:6px;right:8px;font-size:.72rem;background:#16A085;padding:1px 8px;border-radius:6px}
.hl-screen .center{position:absolute;inset:30% 32%;border:2px dashed rgba(255,255,255,.35);border-radius:6px}
.hl-obj{font-size:2.6rem;line-height:1;position:relative;z-index:1;display:grid;place-items:center;gap:4px;padding:8px 10px;border:3px solid transparent;border-radius:8px;color:#fff;font-family:var(--f-display)}
.hl-obj.rec{border-color:#3FE08A}
.hl-obj .idl{position:absolute;top:-24px;left:-3px;font-size:.8rem;background:#3FE08A;color:#0b0e13;padding:0 6px;border-radius:4px;font-family:var(--f-body);font-weight:700;white-space:nowrap}
.hl-obj.learnnew{border-color:#FFC531}
.hl-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hl-btns button{background:#2c3340;color:#e8ecf2;border:1px solid #3d4656;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.88rem}
.hl-btns button.learn{background:#16A085;border-color:#16A085}
.hl-msg{font-size:.88rem;min-height:2.6em;color:#cfd6e2}
.hl-ids{font-size:.85rem;color:#cfd6e2}
.f9{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.f9 button{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.f9 button[aria-pressed="true"]{border-color:var(--b-husky);background:var(--surface)}
.f9 .nn{font-family:var(--f-display);font-size:1.12rem}
.f9 .en{font-size:.74rem;color:var(--muted)}
.fdetail{margin-top:10px;background:var(--surface);border:2px solid var(--b-husky);border-radius:12px;padding:12px 14px}
.fdetail dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:.93rem}
.fdetail dt{font-weight:700;color:var(--muted)}
.fdetail dd{margin:0}
.ira{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
@media (max-width:600px){.ira{grid-template-columns:1fr}}
.ira>div{border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;border:2px solid var(--line);background:var(--sunk)}
.ira>div h5{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.ira .i{border-color:#8E63F2} .ira .j{border-color:#E6A800} .ira .a{border-color:#2BA36B}
.mlw{display:grid;gap:10px}
.mlw .shots{display:flex;gap:6px;flex-wrap:wrap;min-height:44px}
.mlw .shot{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-size:.7rem}
.topic5{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.t5{border-radius:12px;border:1px solid var(--line);border-top:6px solid var(--sc);padding:10px 12px;background:var(--sunk);display:grid;gap:2px;align-content:start}
.t5 b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;word-break:keep-all}
.t5 span{font-size:.84rem;color:var(--muted);word-break:keep-all}
.flowline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.flowline span{padding:6px 12px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);font-weight:500;font-size:.92rem}
.flowline i{font-style:normal;color:var(--muted)}

/* blocks */
.code{display:grid;gap:3px;padding:12px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.code.mini{margin:.5em 0}
.blk{display:inline-flex;align-items:center;gap:6px;justify-self:start;padding:6px 12px;border-radius:7px;color:#fff;font-weight:500;font-size:.9rem;border:2px solid transparent;text-align:left;white-space:nowrap}
button.blk{cursor:pointer}
.blk.dk{color:#18213A}
.blk.picked{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.blk.isbug{border-color:var(--ink);box-shadow:0 0 0 3px var(--bad)}
.blk .slotv{background:rgba(255,255,255,.92);color:#18213A;border-radius:99px;padding:0 8px;font-size:.85rem}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:.5em 0}
.cat-event{background:var(--b-event)} .cat-control{background:var(--b-control)} .cat-move{background:var(--b-move)}
.cat-motor{background:var(--b-motor)} .cat-light{background:var(--b-light)} .cat-sound{background:var(--b-sound)}
.cat-sensor{background:var(--b-sensor)} .cat-op{background:var(--b-op)} .cat-var{background:var(--b-var)} .cat-husky{background:var(--b-husky)}
.numlist{display:flex;gap:6px;flex-wrap:wrap}
.numlist button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;font-weight:700}
.numlist button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.numlist button.solved{border-color:var(--good);color:var(--good)}
.numlist button.solved[aria-current="true"]{background:var(--good);color:#fff}

/* topics */
.tsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tsel button{text-align:left;border:2px solid var(--line);border-top:6px solid var(--sc);background:var(--sunk);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;align-content:start}
.tsel button b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;line-height:1.25;word-break:keep-all}
.tsel button span{font-size:.82rem;color:var(--muted)}
.tsel button[aria-pressed="true"]{border-color:var(--sc);border-top-width:6px;background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 30%,transparent)}
.topic-hero{border-top:8px solid var(--sc)}
.topic-hero h3{font-size:1.7rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kv>div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv h4{margin:0 0 4px;font-size:.82rem;letter-spacing:.04em;color:var(--muted)}
.seeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.seed{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;align-content:start;font-size:.93rem;word-break:keep-all}
.seed b{font-size:1.02rem}
.seed .use{font-size:.8rem;color:var(--muted)}

/* brainstorm */
.dice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.die{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.die span{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.die b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;word-break:keep-all}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sticky{border-radius:4px 4px 14px 4px;padding:12px;display:grid;gap:6px;align-content:space-between;min-height:120px;box-shadow:var(--shadow);color:#18213A;word-break:keep-all}
.sticky.m0{background:#FFE58A} .sticky.m1{background:#A8E6CF} .sticky.m2{background:#FFC2D1} .sticky.mt{background:#C9D7FF}
.sticky .by{font-size:.78rem;opacity:.75}
.sticky .vt{display:flex;gap:6px;align-items:center;justify-content:space-between}
.sticky button{border:1px solid rgba(24,33,58,.25);background:rgba(255,255,255,.6);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:.82rem;color:#18213A}
.sticky button[aria-pressed="true"]{background:#18213A;color:#fff}
.sticky.top{outline:3px solid var(--coral)}
.votes{font-family:var(--f-display);font-size:1.1rem}
.feas{display:grid;gap:6px}
.feas label{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.feas input{margin-top:5px;width:18px;height:18px;flex:none}

/* plan (easel sheet) */
.sheet{background:#FFFDF6;color:#1d2433;border:2px solid #2a2f3a;border-radius:6px;padding:0;overflow:hidden;box-shadow:var(--shadow)}
.sheet .r{display:grid;border-bottom:2px solid #2a2f3a}
.sheet .r:last-child{border-bottom:0}
.sheet .c{padding:10px 12px;border-right:2px solid #2a2f3a;min-width:0}
.sheet .c:last-child{border-right:0}
.sheet .lb{font-size:.8rem;font-weight:700;color:#3b5bdb;display:block;margin-bottom:4px}
.sheet input,.sheet textarea{background:transparent;border:1px dashed #b9bfcc;color:#1d2433;border-radius:6px}
.sheet textarea{min-height:64px}
.sheet .ai-band{background:#E7EEFF}
.sheet .r2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.sheet .r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sheet .r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.sheet .r2,.sheet .r3,.sheet .r4{grid-template-columns:1fr}.sheet .c{border-right:0;border-bottom:1px solid #c9cdd6}}
.sheet .chip{background:#fff;color:#1d2433;border-color:#c9cdd6}
.sheet .chip[aria-pressed="true"]{background:#1d2433;color:#fff}
.sheet .chip.h[aria-pressed="true"]{background:#16A085;border-color:#16A085}
.sheet .ex{font-family:var(--f-display);font-size:1.05rem}
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.chk input{margin-top:5px;width:18px;height:18px;flex:none}
.chk label.ok{border-color:var(--good)}
.approve{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.approve.yes{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}

/* mock timer */
.timer-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.timer-main{grid-template-columns:1fr}}
.clock{font-family:var(--f-display);font-size:clamp(3rem,10vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
.clock.over{color:var(--bad)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stages li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:.94rem}
.stages li .m{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stages li.now{border-color:var(--accent);background:var(--surface);font-weight:700}
.stages li.done{opacity:.6}
.stages li .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.stages li.now .dot{background:var(--accent)} .stages li.done .dot{background:var(--good)}
.stages li .ot{color:var(--bad);font-size:.8rem;font-weight:700}
.logs{display:grid;gap:8px}
.log{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:start;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.92rem}
@media (max-width:640px){.log{grid-template-columns:1fr}}
.log .lb{font-size:.74rem;font-weight:700;color:var(--muted);display:block}

/* pitch */
.slides{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.slide{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:6px;align-content:start}
.slide .sn{display:flex;gap:8px;align-items:center}
.slide .sn b{width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:.85rem}
.slide .src{font-size:.84rem;background:var(--sunk);border-radius:8px;padding:6px 10px;color:var(--muted);white-space:pre-wrap}
.segs{display:grid;gap:4px;margin-top:10px}
.segs div{border-radius:8px;padding:5px 8px;background:var(--sunk);border:1px solid var(--line);font-size:.78rem;text-align:center;word-break:keep-all}
.segs div.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* qa */
.qcard{border-radius:16px;padding:20px;background:var(--ink);color:var(--surface);display:grid;gap:10px;min-height:170px;align-content:center}
.qcard .cat{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.qcard .q{font-family:var(--f-display);font-size:1.6rem;line-height:1.3;word-break:keep-all}
.qcard .who{font-size:1rem}

/* score */
.rub{display:grid;gap:10px}
.rub-g{font-family:var(--f-display);font-size:1.15rem;margin-top:6px}
.rub-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
@media (max-width:560px){.rub-row{grid-template-columns:1fr}}
.rub-row .d{font-size:.86rem;color:var(--muted)}
.rub-row .tp{font-size:.8rem;color:var(--muted);font-style:italic}
.lv{display:flex;gap:4px}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.lv button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.total{display:flex;align-items:baseline;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-size:2.2rem;font-weight:400}
.heat{overflow-x:auto}
.heat table{border-collapse:collapse;font-size:.82rem;min-width:520px}
.heat th,.heat td{padding:5px 7px;border:1px solid var(--line);text-align:center;white-space:nowrap}
.heat td.l10{background:color-mix(in srgb,var(--good) 35%,var(--surface))}
.heat td.l7{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.heat td.l4{background:color-mix(in srgb,var(--bad) 30%,var(--surface))}

/* mech, badges, teacher */
.mech{display:grid;gap:8px;align-content:start}
.mech svg{width:100%;height:96px;background:var(--sunk);border-radius:10px;border:1px solid var(--line)}
.mech dl{margin:0;display:grid;gap:3px;font-size:.92rem}
.mech dt{font-weight:700;font-size:.78rem;color:var(--muted)}
.mech dd{margin:0 0 4px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.badge .ic{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem;background:var(--sunk);color:var(--muted);border:2px dashed var(--line)}
.badge.got .ic{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
.badge span{font-size:.85rem;color:var(--muted);display:block}
.stu{display:grid;gap:8px}
.stu-row{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center}
.lgrid{display:flex;gap:3px;flex-wrap:wrap}
.lgrid i{width:24px;height:24px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.72rem;color:var(--muted)}
.lgrid i.ok{background:var(--good);border-color:var(--good);color:#fff}
.lgrid i.part{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list-edit{display:grid;gap:6px}
.le-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:6px}
.le-row button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;cursor:pointer}

/* v5 additions */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:8px 0 12px}
.figs figure{margin:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;gap:4px}
.figs img{width:100%;height:190px;object-fit:contain;border-radius:8px}
.figs figcaption{font-size:.84rem;color:#4b4775;text-align:center;line-height:1.4}
.lifegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:.6em 0}
.life{background:var(--sunk);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.life b{display:block;margin-bottom:4px}
.life ul{margin:0;padding-left:1.1em;display:grid;gap:3px;font-size:.93rem}
.map3{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:.6em 0}
@media (max-width:560px){.map3{grid-template-columns:1fr}.map3 .arrow{transform:rotate(90deg);justify-self:center}}
.map3>div:not(.arrow){background:var(--sunk);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:3px}
.map3 .arrow{font-family:var(--f-display);font-size:2rem;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:.4em 0}
.weeks>div{background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;display:grid;border:2px solid var(--edge)}
.weeks b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--accent)}
.bodymap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.8fr) auto minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:760px){.bodymap{grid-template-columns:1fr}.bm-arrow{transform:rotate(90deg);justify-self:center}}
.bm-col{display:grid;gap:8px;align-content:start}
.bm-col h5{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.15rem;text-align:center}
.bm-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;background:var(--sunk);border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.bm-item img{width:64px;height:52px;object-fit:contain;background:#fff;border-radius:8px}
.bm-item.bm-text{grid-template-columns:1fr}
.bm-item b{display:block}
.bm-body{display:block;font-weight:700;color:var(--coral)}
.bm-brain{background:var(--surface);border:3px solid var(--edge);border-radius:20px;padding:12px;box-shadow:4px 4px 0 var(--accent);justify-items:center;text-align:center}
.bm-brain img{width:100%;max-width:150px;height:160px;object-fit:contain;background:#fff;border-radius:12px}
.bm-brain b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.bm-arrow{font-family:var(--f-display);font-size:2.2rem;color:var(--muted)}
.h9{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.h9 button{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:6px;cursor:pointer;display:grid;gap:4px;text-align:left}
.h9 button img{width:100%;height:84px;object-fit:cover;border-radius:8px}
.h9 button span{font-weight:700;font-size:.9rem}
.h9 button[aria-pressed="true"]{border-color:var(--b-husky);box-shadow:3px 3px 0 var(--b-husky)}
.fbitem{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.fbitem:first-of-type{border-top:0;margin-top:0}
.tbl.parts input,.tbl.parts select{padding:6px 8px}
textarea[readonly],input[readonly]{opacity:.75}

.guide{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:2px solid var(--edge);border-radius:18px;padding:12px 16px;box-shadow:3px 3px 0 var(--edge)}
.guide ol{margin:6px 0;padding-left:1.4em;display:grid;gap:3px}
.prose p{font-size:1.04rem;line-height:1.8}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:.5em 0}
.mats>div{background:var(--sunk);border:2px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:2px}
.mats span{font-size:.93rem}
.term{border-bottom:2px dotted var(--coral);cursor:help;color:inherit}
.term:hover,.term:focus{background:color-mix(in srgb,var(--coral) 15%,transparent);outline:none}
#termPop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 32px))}
#termPop .tp-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:12px 14px;box-shadow:5px 5px 0 var(--edge)}
#termPop .tp-in:not(:has(img)){grid-template-columns:minmax(0,1fr) auto}
#termPop img{width:72px;height:60px;object-fit:contain;background:#fff;border-radius:10px}
#termPop b{font-family:var(--f-display);font-size:1.25rem;font-weight:400}
#termPop p{margin:2px 0 0}
.figs figcaption b{color:#211C52}
.cardcount{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardcount .cc{width:26px;height:34px;border-radius:4px 4px 10px 4px;background:var(--sunk);border:2px dashed var(--line-strong,#c7cad5)}
.cardcount .cc.on{background:#ffe58a;border:2px solid #e6b800}
.iboard{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.sticky.idea{gap:8px;transform:rotate(var(--rt,0deg));min-height:150px}
.sticky.idea:nth-child(3n){--rt:-1deg}.sticky.idea:nth-child(3n+1){--rt:.8deg}
.sticky.idea .isum{font-size:1.02rem;line-height:1.55}
.sticky.idea .ifut{font-size:.85rem;background:rgba(255,255,255,.55);border-radius:8px;padding:4px 8px}
.sticky.idea .istar{font-weight:800;color:#b45309;font-size:.82rem}
.sticky.idea .vt{flex-wrap:wrap;justify-content:flex-start;gap:6px}
.sticky.idea .icm{background:rgba(255,255,255,.7);border-radius:10px;padding:8px;display:grid;gap:6px}
.sticky.idea .icm p{margin:0;font-size:.88rem}
.icmrow{display:flex;gap:6px}.icmrow input{flex:1;min-width:0;padding:6px 8px;border-radius:8px}
.pickcards{display:grid;gap:10px}
.pickcard{text-align:left;border:2px solid var(--line-strong,#c7cad5);background:#fff7cc;border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:4px;color:#1c1c1e;font:inherit}
.pickcard span{font-size:.88rem;color:#555}
.pickcard.on{border-color:#1c1c1e;box-shadow:0 0 0 3px #ffd02f}
.exfull summary{cursor:pointer;font-weight:800;font-size:1.05rem}
.bigclock{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
.bigclock.run{color:var(--bad)}
.ladder{display:grid;gap:14px;position:relative}
.lstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.lnum{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#1c1c1e;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;box-shadow:0 3px 0 rgba(0,0,0,.12);margin-top:10px}
.lbody{display:grid;gap:8px;min-width:0}
.pickrow{gap:8px}.pickrow .chip{font-size:.95rem;padding:8px 14px;min-height:40px;background:var(--surface);border:2px solid var(--line-strong,#c7cad5)}
.pickrow .chip[aria-pressed="true"]{background:#1c1c1e;color:#ffd02f;border-color:#1c1c1e}
.sentbox{background:var(--blue-light,#e8ecff);border-radius:18px;padding:14px 16px;display:grid;gap:8px;justify-items:start}
.sentbox .sent{font-size:1.12rem;line-height:1.7;font-weight:700;margin:0;color:var(--ink)}
@media (max-width:560px){.lstep{grid-template-columns:34px minmax(0,1fr)}.lnum{width:34px;height:34px;font-size:1.1rem}}

[data-act="ai"],[data-act="aiAll"]{display:none!important}
.kq-on label.f.q{background:var(--sunk);border:2px solid var(--line-soft,#eef0f3);border-radius:18px;padding:14px 16px 16px;gap:6px;position:relative;align-content:start;transition:border-color .2s,background .2s}
.kq-on label.f.q .qt{font-size:1.08rem;font-weight:800;color:var(--ink);padding-right:34px;line-height:1.4}
.kq-on label.f.q .h{font-size:.9rem;color:var(--muted);font-weight:500;line-height:1.45}
.kq-on label.f.q .h:empty{display:none}
.kq-on .grid3{align-items:stretch}
.kq-on .grid3.hashint label.f.q{grid-template-rows:auto minmax(2.9em,auto) 1fr}
.kq-on .grid3.hashint label.f.q .h:empty{display:block}
.kq-on .grid3:not(.hashint) label.f.q{grid-template-rows:auto 1fr}
.kq-on label.f.q input[type=text],.kq-on label.f.q textarea{font-size:1.05rem;padding:12px 14px;border:2px solid var(--line-strong,#c7cad5);background:var(--surface);border-radius:14px;min-height:50px}
.kq-on label.f.q textarea{min-height:96px;line-height:1.6;height:100%}
.kq-on label.f.q input:focus,.kq-on label.f.q textarea:focus{border-color:#ffb800;box-shadow:0 0 0 4px rgba(255,208,47,.35)}
.kq-on label.f.q.filled{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 7%,var(--sunk))}
.kq-on label.f.q::after{content:"";position:absolute;right:14px;top:14px;width:24px;height:24px;border-radius:50%;border:2px dashed var(--line-strong,#c7cad5)}
.kq-on label.f.q.filled::after{content:"✓";border:0;background:var(--good);color:#fff;font-weight:900;font-size:.9rem;display:grid;place-items:center}
.kq-on .toy{display:grid;gap:14px}
.kqprog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;color:var(--muted)}
.kqprog .bar{flex:1;height:12px;border-radius:99px;background:var(--sunk);border:0;overflow:hidden}
.kqprog .bar>span{display:block;height:100%;background:linear-gradient(90deg,#ffd02f,#00b473);border-radius:99px;transition:width .3s}
.kq-on .tbl.parts td{vertical-align:middle}
.kq-on .tbl.parts input,.kq-on .tbl.parts select{font-size:1rem;min-height:42px}
.kqtip{font-size:.95rem;color:var(--ink);background:var(--yellow-light,#fff4c4);border-radius:12px;padding:8px 12px}
#ntFab{right:auto!important;left:max(16px,env(safe-area-inset-left,0px))}
#ntPanel{right:auto!important;left:max(16px,env(safe-area-inset-left,0px))}

.figs img[src*="life"]{height:auto;aspect-ratio:3/2;object-fit:cover}

/* fonts v5.1: chunky toy-like titles, rounded friendly body, handwriting for the easel-pad plan */
:root{--f-hero:"Bagel Fat One","Jua","Apple SD Gothic Neo",sans-serif;--f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-hand:"Nanum Pen Script","Gowun Dodum",cursive}
body{font-size:17px;letter-spacing:-.005em}
.pagehead h2,.hello h2,.brand h1,.banner b,.dday b,.ptop+div h2,.whobtn,.pagehead[style] h2{font-family:var(--f-hero);font-weight:400;letter-spacing:.01em}
.hello h2{font-size:2.5rem}
.sheet .ex{font-family:var(--f-hand);font-size:1.45rem;line-height:1.3}
.sheet .lb{font-family:var(--f-body)}
b,strong{font-weight:700}


/* ===== Theme v6: Miro base (white canvas, canary-yellow + blue, pill buttons, flat hairline cards)
   + Notion pastel tints for phases + Pinterest masonry for photo galleries ===== */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --sunk:#f7f8fa; --ink:#1c1c1e; --ink-deep:#050038; --edge:#e0e2e8; --muted:#555a6a; --line:#e0e2e8; --line-soft:#eef0f3; --line-strong:#c7cad5;
  --accent:#ffd02f; --accent-deep:#fcb900; --accent-ink:#1c1c1e; --yellow-light:#fff4c4; --blue:#4262ff; --blue-light:#e8ecff; --coral:#ff9999; --teal:#0fbcb0; --sky:#4262ff;
  --good:#00b473; --warn:#b37a00; --bad:#e5484d;
  --t-yellow:#fef7d6; --t-peach:#ffe8d4; --t-mint:#d9f3e1; --t-sky:#dcecfa; --t-lavender:#e6e0f5; --t-rose:#fde0ec;
  --sh1:0 1px 2px rgba(5,0,56,.04); --sh2:0 4px 12px rgba(5,0,56,.06); --sh3:0 12px 32px -4px rgba(5,0,56,.08); --sh4:0 16px 48px -8px rgba(5,0,56,.12);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-hero:"Bagel Fat One","Jua","Apple SD Gothic Neo",sans-serif; --f-brand:"Bagel Fat One","Jua",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121218; --surface:#1c1c24; --sunk:#16161d; --ink:#f2f2f5; --ink-deep:#ffffff; --edge:#2e2e3a; --muted:#a3a6b5; --line:#2e2e3a; --line-soft:#26262f; --line-strong:#3d3d4b;
  --yellow-light:#3a3210; --blue:#7b8fff; --blue-light:#1f2547; --good:#2fd39a; --warn:#f2b84b; --bad:#ff7b7f;
  --t-yellow:#36301a; --t-peach:#3a2a1f; --t-mint:#1d3326; --t-sky:#1c2a3a; --t-lavender:#2a2540; --t-rose:#3a2230;
  --sh1:none; --sh2:0 4px 12px rgba(0,0,0,.35); --sh3:0 12px 32px -4px rgba(0,0,0,.45); --sh4:0 16px 48px -8px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121218; --surface:#1c1c24; --sunk:#16161d; --ink:#f2f2f5; --ink-deep:#ffffff; --edge:#2e2e3a; --muted:#a3a6b5; --line:#2e2e3a; --line-soft:#26262f; --line-strong:#3d3d4b;
  --yellow-light:#3a3210; --blue:#7b8fff; --blue-light:#1f2547; --good:#2fd39a; --warn:#f2b84b; --bad:#ff7b7f;
  --t-yellow:#36301a; --t-peach:#3a2a1f; --t-mint:#1d3326; --t-sky:#1c2a3a; --t-lavender:#2a2540; --t-rose:#3a2230;
  --sh1:none; --sh2:0 4px 12px rgba(0,0,0,.35); --sh3:0 12px 32px -4px rgba(0,0,0,.45); --sh4:0 16px 48px -8px rgba(0,0,0,.55); color-scheme:dark}

body{background:var(--bg);background-image:none;font-size:17px;line-height:1.7}
h1,h2,h3,h4{color:var(--ink-deep)}
:root:not([data-theme="light"]) h1{color:inherit}
/* header: white bar, hairline, pill tabs */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brand-mark{background:var(--accent);border:0;box-shadow:none;border-radius:12px}
.brand h1{font-family:var(--f-brand);font-size:1.25rem;letter-spacing:.01em}
.who-chip{border:1px solid var(--line-strong);box-shadow:none;font-weight:600}
.av{border:0;color:#1c1c1e}
.av.m0{background:#ffd02f}.av.m1{background:#c3faf5}.av.m2{background:#ffc6c6}.av.mt{background:#e8ecff}
nav.tabs{gap:4px}
nav.tabs a{border:0;padding:7px 16px;font-weight:600}
nav.tabs a[aria-current="true"]{background:var(--ink);color:var(--surface)}
nav.tabs a:hover:not([aria-current="true"]){background:var(--sunk);color:var(--ink)}
/* cards */
.panel,.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;box-shadow:none;padding:24px}
.toy{background:var(--surface);border:1px solid var(--line-soft);border-radius:28px;box-shadow:var(--sh2);padding:28px}
@media (max-width:560px){.toy{padding:20px;border-radius:20px}.panel,.card{padding:18px}}
.pagehead h2,.hello h2,.ptop+div h2{font-family:var(--f-hero);letter-spacing:-.01em}
.pagehead h2{font-size:2.2rem}
.hello h2{font-size:2.6rem}
/* buttons: pills */
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9999px;padding:10px 22px;box-shadow:none;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn:active{transform:none;box-shadow:none;filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1c1c1e}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:6px 14px;border-radius:9999px}
.btn.big{padding:13px 28px;border-radius:9999px;font-size:1.05rem}
.btn:disabled{opacity:.45}
/* tags & chips */
.tag{border-radius:9999px;border:0;background:var(--sunk);color:var(--muted);padding:3px 11px;font-weight:600}
.tag.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--ink)}
.tag.need{background:var(--yellow-light);color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9999px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
.note{background:var(--sunk);border:0;border-radius:12px;color:var(--muted)}
.callout{background:var(--blue-light);border-left:0;border-radius:12px}
.callout.warn{background:var(--yellow-light)}
.explain{background:var(--yellow-light);border-left:0;border-radius:12px}
.q-opt{border:1px solid var(--line-strong);box-shadow:none;border-radius:16px}
.q-opt:hover:not(:disabled){border-color:var(--ink)}
.banner{background:var(--ink-deep);border:0;border-radius:28px;color:#fff}
.banner b{font-family:var(--f-brand)}
.rule{border-width:1px;border-radius:16px}
.duo>div,.pat>div,.kv>div,.life,.mats>div,.map3>div:not(.arrow),.seed{border:0;border-radius:16px;background:var(--sunk)}
.bar{border:0;height:10px;background:var(--line-soft)}
.empty{border:1px dashed var(--line-strong);border-radius:20px;background:var(--surface)}
.toast{border:0;border-radius:9999px;box-shadow:var(--sh4)}
/* who screen: sticky notes */
.whobtn{border:0;box-shadow:var(--sh2);border-radius:20px;font-family:var(--f-display);transform:rotate(-1deg)}
.whobtn:nth-child(1){background:#fff4c4}.whobtn:nth-child(2){background:#c3faf5;transform:rotate(1deg)}.whobtn:nth-child(3){background:#ffd8f4;transform:rotate(-.5deg)}.whobtn:nth-child(4){background:#e8ecff;transform:rotate(1.2deg)}
.whobtn{color:#1c1c1e}
.whobtn:hover{box-shadow:var(--sh3)}
.whobtn:active{transform:none;box-shadow:var(--sh1)}
.whobtn .av{background:#fff!important;width:60px;height:60px}
/* home */
.dday{background:var(--ink-deep);border:0;box-shadow:var(--sh2);border-radius:20px}
.dday b{font-family:var(--f-brand)}
.mcard{border:0;box-shadow:var(--sh2);border-radius:28px}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh3)}
.mcard .band{background:var(--pc);border-bottom:0;padding:18px 20px 14px}
.mcard .body{padding:8px 20px 20px}
.mcard h4{font-size:1.4rem}
.stamp{border-color:var(--good);color:var(--good);background:var(--surface);border-radius:9999px;top:auto;bottom:18px;right:16px;transform:rotate(-8deg);font-size:1.05rem}
.mrow{border:1px solid var(--line-soft);border-radius:16px}
.mrow:hover{border-color:var(--line-strong);box-shadow:var(--sh1)}
.mrow .dot{border:0;width:12px;height:12px}
.jstep{border:0;background:var(--surface);box-shadow:var(--sh1);border-radius:20px}
.jstep .ring{border:0;background:conic-gradient(var(--pc) calc(var(--p)*1%),var(--line-soft) 0)}
.phase-tag{border:0;background:var(--pc);border-radius:9999px;color:#1c1c1e}
.guide{background:var(--t-yellow);border:0;box-shadow:none;border-radius:20px}
.donebox{border:0;box-shadow:var(--sh2);border-radius:28px;background:var(--t-mint)}
.preview-note{background:var(--blue-light);border:0;border-radius:12px}
.dots button.on{outline:0;background:var(--ink)}
.dots button.seen{background:var(--accent)}
.pdots i.cur{background:var(--ink)}
.try{border:0;background:var(--t-mint);border-radius:16px}
.try b{color:#0b7d5c}
/* Pinterest-style masonry for photos */
.figs{display:block;columns:3 220px;column-gap:14px;margin:10px 0 16px}
.figs figure{break-inside:avoid;margin:0 0 14px;border:0;padding:0;background:transparent;display:block}
.figs img{width:100%;height:auto;max-height:340px;object-fit:contain;border-radius:16px;background:#fff;box-shadow:var(--sh1);display:block}
.figs figcaption{text-align:left;padding:6px 4px 0;color:var(--muted)}
.h9 button{border:1px solid var(--line-soft);border-radius:16px}
.h9 button[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--sh2)}
.h9 button img{border-radius:12px}
.fdetail{border:0;background:var(--sunk);border-radius:20px}
.bm-item{border:0;background:var(--sunk);border-radius:16px}
.bm-brain{border:0;box-shadow:var(--sh2);background:var(--t-yellow);border-radius:24px}
.bm-body{color:#c2410c}
/* sticky notes stay sticky */
.sticky{border-radius:4px 4px 18px 4px;box-shadow:var(--sh2)}
/* plan sheet keeps the easel-pad look */
.sheet{border:1px solid #c9ccd6;border-radius:16px;box-shadow:var(--sh2)}
.sheet .r{border-bottom:1px solid #d9dce5}.sheet .c{border-right:1px solid #d9dce5}
/* teacher */
.tstat{border:0;box-shadow:var(--sh1);border-radius:20px}

  {q:'심사 항목 하나에서 "보통"을 받으면 몇 점일까요?',o:['7점','10점','4점','5점'],a:0,e:'우수 10점, 보통 7점, 미흡 4점이에요.'}
 ]},
 {id:'l2',n:2,t:'허브: 스파이크의 두뇌',min:10,goal:'우리 키트에 무엇이 들어 있는지, 허브의 각 부분이 하는 일을 알아요.',cards:[
  {h:'우리 키트에는 무엇이 있을까?',b:'<p>우리는 <b>스파이크 프라임 코어 세트(45678)</b>에 <b>허스키렌즈</b>를 더한 AI 키트를 써요. 카드를 눌러서 하나씩 알아봐요.</p>',w:'kit'},
  {h:'허브를 살펴봐요',b:'<p><b>허브</b>는 로봇의 두뇌예요. 우리가 만든 코드를 기억하고, 센서에서 정보를 받아 모터를 움직여요. 그림에서 궁금한 부분을 눌러 보세요.</p>',w:'hub'},
  {h:'포트 A~F: 꽂는 자리',b:'<p>허브에는 모터와 센서를 꽂는 <b>포트가 6개</b>(A, B, C, D, E, F) 있어요. 코드에서는 "A 포트의 모터"처럼 포트 이름으로 불러요.</p><div class="callout warn"><b>가장 많이 하는 실수</b> 모터를 C에 꽂고 코드에는 A라고 쓰면 로봇이 움직이지 않아요. 만들기 시작할 때 "포트 표"를 적어 두면 좋아요.</div><table class="tbl"><tr><th>포트</th><th>꽂은 것</th></tr><tr><td>A</td><td>왼쪽 바퀴 모터</td></tr><tr><td>B</td><td>오른쪽 바퀴 모터</td></tr><tr><td>C</td><td>허스키렌즈</td></tr><tr><td>D</td><td>거리 센서</td></tr></table><p class="small">예시 표예요. 우리 로봇에 맞게 정해요.</p>'},
  {h:'허브 안에 숨은 장치들',b:'<ul class="bul"><li><b>라이트 매트릭스</b>: 5×5 칸의 불빛. 글자, 숫자, 표정을 보여 줘요. (출력)</li><li><b>스피커</b>: 소리와 음을 내요. (출력)</li><li><b>버튼</b>: 왼쪽, 오른쪽, 가운데 버튼도 입력으로 쓸 수 있어요. (입력)</li><li><b>자이로 센서(동작 센서)</b>: 허브가 얼마나 돌았는지, 기울었는지, 흔들리는지 알아요. (입력)</li></ul><p>허브 하나만으로도 입력과 출력을 모두 할 수 있어요.</p>'},
  {h:'켜기, 연결하기, 충전하기',b:'<ol class="steps"><li><b>켜기</b>: 가운데 버튼을 눌러요.</li><li><b>연결하기</b>: 스파이크 앱에서 <b>허브 연결</b>을 눌러 노트북과 연결해요. 블루투스나 USB 케이블로 연결할 수 있어요.</li><li><b>충전하기</b>: USB 케이블로 충전해요. 대회는 저녁까지 이어지니 배터리를 꼭 챙겨요.</li></ol>'},
  {h:'허브 이름 바꾸기',b:'<p>대회장에는 허브가 아주 많아서 블루투스가 헷갈릴 수 있어요. 그래서 허브 이름을 <b>학교 이름 + 팀 기호 + 허브 번호</b>로 바꿔요.</p><div class="callout">예: 대한초 a팀의 허브 2대 → <b>대한초a1</b>, <b>대한초a2</b></div><ol class="steps"><li>허브를 켜고 앱에서 <b>허브 연결</b>을 눌러요.</li><li>연결된 허브 화면 위쪽의 <b>이름 바꾸기</b>를 눌러요.</li><li>정해진 이름을 입력하고 <b>완료</b>를 눌러요.</li></ol>',t:'허브를 켜고 앱과 연결한 다음, 라이트 매트릭스에 내 이름 첫 글자를 띄워 봐요.'}
 ],quiz:[
  {q:'허브에 모터와 센서를 꽂는 포트는 몇 개일까요?',o:['6개','4개','8개','2개'],a:0,e:'A부터 F까지 6개예요.'},
  {q:'허브 안에 들어 있는 센서는 무엇일까요?',o:['자이로 센서(동작 센서)','거리 센서','컬러 센서','허스키렌즈'],a:0,e:'자이로 센서는 허브 안에 들어 있어서 회전, 기울기, 흔들림을 알 수 있어요.'},
  {q:'모터를 C 포트에 꽂고 코드에는 A 포트라고 썼어요. 어떻게 될까요?',o:['모터가 움직이지 않는다','그래도 잘 움직인다','허브가 꺼진다','두 배로 빨라진다'],a:0,e:'꽂은 포트와 코드의 포트가 같아야 해요.'},
  {q:'라이트 매트릭스는 입력 장치일까요, 출력 장치일까요?',o:['출력 장치','입력 장치','둘 다 아니다','센서이다'],a:0,e:'불빛으로 보여 주는 장치라서 출력 장치예요.'}
 ]},
 {id:'l3',n:3,t:'모터: 움직이는 힘',min:10,goal:'모터 종류와 각도, 이동 블록의 차이를 알아요.',cards:[
  {h:'우리 키트의 모터 3개',b:'<div class="duo"><div><b>대형 모터 1개</b><span>힘이 세요. 무거운 것을 들거나 큰 바퀴를 돌릴 때 좋아요.</span></div><div><b>중형 모터 2개</b><span>작고 빨라요. 바퀴 한 쌍이나 팔, 차단봉에 좋아요.</span></div></div><p>모터는 로봇을 움직이는 <b>출력 장치</b>예요.</p>'},
  {h:'모터 안의 각도 센서',b:'<p>스파이크 모터 안에는 <b>얼마나 돌았는지 재는 센서</b>가 들어 있어요. 그래서 "90도만 돌아"처럼 정확하게 움직일 수 있어요. 막대를 움직여 보세요.</p>',w:'motor'},
  {h:'이동 모터: 바퀴 두 개를 한 쌍으로',b:'<p>바퀴 두 개를 <b>이동 모터</b>로 정하면 "앞으로 10cm 이동하기", "오른쪽으로 돌기"처럼 블록 하나로 로봇을 움직일 수 있어요.</p><ul class="bul"><li><b>조향</b>: 0이면 똑바로 가고, 값에 따라 왼쪽이나 오른쪽으로 휘어 가요.</li><li><b>속도</b>: 느리게 하면 더 정확해요. 처음에는 50% 정도로 시작해요.</li></ul><div class="callout">조향 값이 플러스일 때 어느 쪽으로 도는지는 직접 돌려 보며 확인해요. 바퀴를 어떻게 달았는지에 따라 달라 보일 수 있어요.</div>'},
  {h:'아주 중요한 차이: "하기"와 "시작하기"',b:'<div class="duo"><div><b>"앞으로 10cm 이동하기"</b><span>다 갈 때까지 다음 블록으로 넘어가지 않아요. 가는 동안 센서를 확인할 수 없어요.</span></div><div><b>"앞으로 이동 시작하기"</b><span>움직이기 시작하자마자 다음 블록으로 넘어가요. 움직이면서 센서를 확인할 수 있어요.</span></div></div><p><b>센서로 멈추는 로봇</b>(벽 앞에서 멈추기, 얼굴을 보면 멈추기)은 꼭 "시작하기" 블록을 써야 해요.</p>'},
  {h:'힘이 더 필요하면 기어',b:'<p>작은 기어로 큰 기어를 돌리면 <b>느려지지만 힘이 세져요</b>(감속). 반대로 큰 기어로 작은 기어를 돌리면 빨라지지만 힘이 약해져요.</p><p>무거운 팔이 잘 안 올라가면 속도를 올리기보다 기어를 바꿔 봐요. 자세한 구조는 <b>연습장 → 메커니즘 도감</b>에 있어요.</p>',t:'중형 모터 하나를 꽂고 90도, 180도, 360도 돌려 보며 몇 바퀴인지 눈으로 확인해요.'}
 ],quiz:[
  {q:'모터가 360도 돌면 몇 바퀴일까요?',o:['1바퀴','반 바퀴','2바퀴','4분의 1바퀴'],a:0,e:'한 바퀴가 360도예요. 90도는 4분의 1바퀴예요.'},
  {q:'벽 앞에서 멈추는 로봇에는 어떤 블록이 필요할까요?',o:['"이동 시작하기" 블록','"10cm 이동하기" 블록','"소리 재생" 블록','아무 블록이나 괜찮다'],a:0,e:'움직이면서 센서를 확인하려면 "시작하기" 블록을 써야 해요.'},
  {q:'무거운 것을 들어 올리기에 더 좋은 모터는?',o:['대형 모터','중형 모터','둘 다 똑같다','허스키렌즈'],a:0,e:'대형 모터가 힘이 더 세요. 기어를 함께 쓰면 더 좋아요.'}
 ]},
 {id:'l4',n:4,t:'센서: 로봇의 감각',min:12,goal:'컬러, 거리, 힘 센서와 자이로 센서가 무엇을 알아채는지 알아요.',cards:[
  {h:'센서는 로봇의 눈, 귀, 손',b:'<p><b>센서</b>는 주변의 정보를 알아채서 허브에 알려 주는 <b>입력 장치</b>예요. 우리 키트에는 이런 센서가 있어요.</p><ul class="bul"><li><b>컬러 센서</b>: 색과 밝기</li><li><b>거리 센서</b>: 앞에 있는 물체까지의 거리</li><li><b>힘 센서</b>: 눌렀는지, 얼마나 세게 눌렀는지</li><li><b>자이로 센서</b> (허브 안): 회전, 기울기, 흔들림</li><li><b>허스키렌즈</b>: AI로 얼굴, 물체, 색, 선, 태그 등을 알아봐요 (레슨 7~9)</li></ul>'},
  {h:'컬러 센서',b:'<p>바로 앞에 있는 물체의 <b>색</b>과, 빛이 얼마나 반사되는지(<b>반사광 %</b>)를 알려 줘요. 물체에서 <b>약 1.6cm</b> 떨어졌을 때 가장 정확해요. 검정, 보라, 파랑, 하늘, 초록, 노랑, 빨강, 흰색 8가지 색을 알아봐요. 색을 눌러 보세요.</p>',w:'color'},
  {h:'거리 센서',b:'<p>박쥐처럼 소리(초음파)를 보내고 돌아오는 시간으로 <b>거리를 cm로</b> 재요. <b>약 5cm부터 200cm까지</b> 잴 수 있고, 30cm 안쪽은 더 빨리 재요. 센서 눈 주위의 불빛을 켜서 표정처럼 쓸 수도 있어요. 막대를 움직여 보세요.</p>',w:'dist',t:''},
  {h:'힘 센서',b:'<p>버튼처럼 <b>눌렸는지, 세게 눌렸는지, 떼었는지</b>를 알아요. 얼마나 센 힘인지도 숫자로 알 수 있어요. <b>약 2.5N</b>보다 세게 눌러야 눌린 것으로 알고, <b>10N</b>까지 재요. 버튼을 꾹 눌러 보세요.</p>',w:'force'},
  {h:'자이로 센서 (허브 안)',b:'<ul class="bul"><li><b>회전 각도(요)</b>: 로봇이 몇 도 돌았는지 알아요. 정확히 90도 돌 때 써요. 돌기 전에 각도를 0으로 맞추는 것이 중요해요.</li><li><b>기울기</b>: 로봇이 넘어졌는지 알 수 있어요.</li><li><b>흔들림</b>: 지진처럼 흔들리는 것을 알 수 있어요.</li></ul>'},
  {h:'어떤 센서를 고를까?',b:'<table class="tbl"><tr><th>이럴 때</th><th>이 센서</th></tr><tr><td>바닥의 선을 따라가기</td><td>컬러 센서 (또는 허스키렌즈 라인 추적)</td></tr><tr><td>사람이 다가오면 알리기</td><td>거리 센서</td></tr><tr><td>버튼을 누르면 시작</td><td>힘 센서</td></tr><tr><td>정확히 90도 돌기</td><td>자이로 센서</td></tr><tr><td>누구인지, 무엇인지 알아보기</td><td>허스키렌즈</td></tr></table><p>센서 하나만 쓰기보다 <b>허스키렌즈 + 센서 하나</b>를 함께 쓰면 작품이 더 똑똑해져요.</p>',t:'각 센서의 값을 앱 화면에 띄워 보고, 검은색과 흰색 바닥의 반사광 값을 적어 봐요. 이 두 값의 가운데가 "기준값"이 돼요.'}
 ],quiz:[
  {q:'사람이 가까이 오면 알려 주는 로봇에 가장 알맞은 센서는?',o:['거리 센서','컬러 센서','힘 센서','라이트 매트릭스'],a:0,e:'거리 센서는 앞의 물체까지 거리를 cm로 알려 줘요.'},
  {q:'바닥의 검은 선을 따라가려면 컬러 센서로 무엇을 재면 좋을까요?',o:['반사광 %','거리 cm','힘의 세기','소리 크기'],a:0,e:'검은색은 빛을 적게 반사해서 값이 작고, 흰색은 커요.'},
  {q:'정확히 90도 돌기 전에 꼭 해야 할 일은?',o:['회전 각도를 0으로 맞추기','소리 켜기','센서 빼기','속도를 100%로 하기'],a:0,e:'각도를 0으로 맞추지 않으면 전에 돈 각도부터 계산해서 틀려요.'},
  {q:'힘 센서가 알 수 없는 것은?',o:['물체의 색','눌렸는지','세게 눌렸는지','떼었는지'],a:0,e:'색은 컬러 센서나 허스키렌즈가 알아요.'}
 ]},
 {id:'l5',n:5,t:'블록 코딩 기초',min:12,goal:'입력, 처리, 출력과 이벤트, 반복, 조건, 변수를 알아요.',cards:[
  {h:'입력 → 처리 → 출력',b:'<p>로봇은 <b>입력</b>(정보 받기) → <b>처리</b>(판단하기) → <b>출력</b>(행동하기) 순서로 일해요. 아래 카드를 알맞은 칸으로 옮겨 보세요. 카드를 누른 다음 칸을 누르면 돼요.</p>',w:'ipo'},
  {h:'스파이크 블록 꾸러미',b:'<p>스파이크 앱의 블록은 색깔별로 나뉘어 있어요.</p><div class="cats"><span class="blk cat-motor">모터</span><span class="blk cat-move">이동</span><span class="blk cat-light">표시등</span><span class="blk cat-sound">소리</span><span class="blk dk cat-event">이벤트</span><span class="blk dk cat-control">제어</span><span class="blk cat-sensor">센서</span><span class="blk cat-op">연산자</span><span class="blk cat-var">변수</span></div><p class="small">앱 버전에 따라 이름이나 색이 조금 다를 수 있어요.</p>'},
  {h:'이벤트: 언제 시작할까?',b:'<p>노란 <b>이벤트</b> 블록은 "언제 시작할지"를 정해요.</p><div class="code mini"><span class="blk dk cat-event">프로그램이 시작되면</span><span class="blk dk cat-event">힘 센서가 눌리면</span><span class="blk dk cat-event">허브가 흔들리면</span></div><p>대회 시연 때는 <b>힘 센서를 누르면 시작</b>하게 하면 원하는 순간에 시작할 수 있어 편해요.</p>'},
  {h:'반복: 계속 확인하기',b:'<p>블록은 <b>위에서 아래로 한 번씩</b> 실행돼요. 센서를 계속 확인하려면 <b>무한 반복</b> 안에 넣어야 해요.</p><div class="code mini"><span class="blk dk cat-event">프로그램이 시작되면</span><span class="blk dk cat-control">무한 반복하기</span><span class="blk cat-sensor" style="margin-left:24px">센서 확인하기</span><span class="blk cat-move" style="margin-left:24px">움직이기</span></div><p>무한 반복이 없으면 처음에 딱 한 번만 확인하고 끝나요.</p>'},
  {h:'조건: 만약 ~라면',b:'<p><b>만약 ~라면 / 아니면</b> 블록으로 상황에 따라 다르게 움직여요.</p><div class="code mini"><span class="blk dk cat-control">만약 거리 센서 &lt; 10cm 라면</span><span class="blk cat-move" style="margin-left:24px">이동 멈추기</span><span class="blk dk cat-control">아니면</span><span class="blk cat-move" style="margin-left:24px">앞으로 이동 시작하기</span></div><div class="callout warn"><b>부등호 조심</b> &lt; 는 "작다(가깝다)", &gt; 는 "크다(멀다)"예요. 반대로 쓰면 로봇이 거꾸로 움직여요.</div>'},
  {h:'변수: 숫자를 기억하는 상자',b:'<p><b>변수</b>는 숫자를 기억하는 이름표 붙은 상자예요. 몇 명이 지나갔는지, 몇 번 눌렀는지 셀 때 써요.</p><div class="code mini"><span class="blk cat-var">횟수를 0으로 정하기</span><span class="blk cat-var">횟수를 1만큼 바꾸기</span></div><p>시작할 때 <b>0으로 정하기</b>를 꼭 넣어요.</p>'},
  {h:'안 될 때 고치는 순서 (디버깅)',b:'<ol class="steps"><li><b>포트 확인</b>: 꽂은 곳과 코드가 같은가?</li><li><b>센서 값 보기</b>: 센서가 실제로 어떤 값을 주는지 화면에 띄워요.</li><li><b>조금씩 실행</b>: 블록을 나눠서 하나씩 실행해 봐요.</li><li><b>한 번에 하나만 바꾸기</b>: 여러 개를 한꺼번에 바꾸면 무엇이 문제였는지 몰라요.</li><li><b>기록하기</b>: 무엇이 안 됐고, 어떻게 고쳤는지 적어요. 이게 발표 재료가 돼요!</li></ol>',t:'"힘 센서를 누르면 라이트 매트릭스에 웃는 얼굴을 보여 주는" 코드를 직접 만들어 봐요.'}
 ],quiz:[
  {q:'센서를 계속 확인하려면 어떤 블록이 필요할까요?',o:['무한 반복하기','프로그램이 시작되면','소리 재생하기','이동 멈추기'],a:0,e:'무한 반복 안에 넣어야 계속 확인해요.'},
  {q:'"거리 &lt; 10cm"는 무슨 뜻일까요?',o:['거리가 10cm보다 가깝다','거리가 10cm보다 멀다','거리가 정확히 10cm다','거리를 잴 수 없다'],a:0,e:'&lt; 는 "보다 작다", 즉 가깝다는 뜻이에요.'},
  {q:'로봇이 안 움직일 때 가장 먼저 확인할 것은?',o:['포트가 맞는지','발표 대본','디오라마 색깔','팀 이름'],a:0,e:'포트가 틀린 경우가 가장 많아요.'},
  {q:'다음 중 "출력"은?',o:['모터가 돈다','거리 센서가 거리를 잰다','힘 센서를 누른다','허스키렌즈가 얼굴을 본다'],a:0,e:'모터가 도는 것은 행동, 즉 출력이에요.'}
 ]},
 {id:'l6',n:6,t:'AI와 머신러닝',min:10,goal:'AI가 어떻게 배우는지, 왜 틀릴 수 있는지 알아요.',cards:[
  {h:'AI는 어떻게 똑똑해질까?',b:'<p><b>AI(인공지능)</b>는 사람처럼 보고, 듣고, 판단하는 컴퓨터 기술이에요.</p><p><b>머신러닝</b>은 컴퓨터가 <b>예시를 많이 보고 스스로 규칙을 배우는</b> 방법이에요. 우리가 고양이 사진을 많이 보여 주면, 컴퓨터는 "이런 모양이 고양이구나" 하고 배워요.</p>'},
  {h:'꼭 알아야 할 낱말 3개',b:'<table class="tbl"><tr><th>낱말</th><th>뜻</th><th>허스키렌즈에서는</th></tr><tr><td><b>학습</b></td><td>컴퓨터가 예시를 보고 배우는 과정</td><td>학습 버튼을 눌러 보여 주기</td></tr><tr><td><b>모델</b></td><td>배운 것을 기억하고 판단하는 방식</td><td>허스키렌즈 안에 저장된 학습 결과</td></tr><tr><td><b>클래스</b></td><td>구별할 대상의 종류</td><td><b>ID 번호</b> (ID 1, ID 2…)</td></tr></table>'},
  {h:'예시가 많을수록, 다양할수록',b:'<p>한 장만 보고 배운 AI는 조금만 달라져도 못 알아봐요. 여러 각도, 여러 거리, 여러 밝기에서 보여 줄수록 잘 알아봐요. 버튼을 눌러 학습시켜 보세요.</p>',w:'ml'},
  {h:'AI도 틀려요',b:'<ul class="bul"><li><b>조명이 바뀌면</b>: 교실에서 학습한 색이 대회장 불빛에서는 달라 보여요.</li><li><b>비슷한 것이 있으면</b>: 빨간 공과 주황 공을 헷갈려요.</li><li><b>배우지 않은 것</b>: 학습하지 않은 물건은 알아볼 수 없어요.</li></ul><div class="callout">그래서 <b>여러 번 테스트</b>하고, <b>AI가 아무것도 못 알아봤을 때 로봇이 무엇을 할지</b>도 미리 정해야 해요.</div>'},
  {h:'우리 대회의 AI = 허스키렌즈',b:'<div class="duo"><div><b>써야 하는 AI</b><span>허스키렌즈: 우리가 직접 학습시키고, 코드로 연결해요.</span></div><div class="no"><b>쓰면 안 되는 AI</b><span>생성형 AI: 글이나 그림을 대신 만들어 주는 챗봇과 도구는 대회에서 모두 금지예요.</span></div></div><p>대주제의 "AI로 상상하고"는 <b>허스키렌즈가 무엇을 알아보면 문제가 해결될지 상상하라</b>는 뜻이에요.</p>'}
 ],quiz:[
  {q:'허스키렌즈에서 "클래스"는 무엇으로 나타날까요?',o:['ID 번호','화면 밝기','배터리','포트 이름'],a:0,e:'학습한 종류마다 ID 1, ID 2처럼 번호가 붙어요.'},
  {q:'AI가 더 잘 알아보게 하려면?',o:['여러 각도와 거리에서 많이 학습시킨다','한 장만 학습시킨다','어두운 곳에서만 학습시킨다','학습을 하지 않는다'],a:0,e:'다양한 예시를 많이 보여 줄수록 잘 알아봐요.'},
  {q:'대회에서 쓸 수 있는 AI는?',o:['허스키렌즈','그림 만들어 주는 AI','글 써 주는 챗봇','발표 대본 써 주는 AI'],a:0,e:'생성형 AI는 금지예요. 허스키렌즈를 써요.'}
 ]},
 {id:'l7',n:7,t:'허스키렌즈 만나기',min:12,goal:'허스키렌즈를 연결하고, 버튼 2개로 학습시키는 방법을 알아요.',cards:[
  {h:'허스키렌즈는 AI 카메라',b:'<p><b>허스키렌즈</b>는 <b>머신러닝 기능이 있는 AI 카메라</b>예요. 얼굴, 물체, 색, 선, 태그 등을 알아보고, 그 정보를 스파이크 허브로 보내 로봇을 움직여요.</p>',w:'huskyparts'},
  {h:'연결하는 순서',b:'<ol class="steps"><li>케이블을 <b>허스키렌즈에 먼저</b> 꽂아요.</li><li>반대쪽을 <b>허브 포트</b>(예: C 포트)에 꽂아요.</li></ol><div class="callout warn"><b>알아 두기</b> 대회 연수 자료에 따르면 스파이크 앱에서는 허스키렌즈가 <b>"컬러 센서"로 표시</b>돼요. 진짜 컬러 센서도 같이 쓴다면 포트를 헷갈리지 않게 표에 적어 둬요.</div>'},
  {h:'버튼 2개만 기억해요',b:'<table class="tbl"><tr><th>버튼</th><th>이렇게 써요</th></tr><tr><td><b>기능 버튼</b> (다이얼)</td><td>좌우로 <b>돌려서</b> 기능을 고르고, <b>길게 눌러</b> 설정해요.</td></tr><tr><td><b>학습 버튼</b></td><td><b>짧게 눌러</b> 학습하고, <b>두 번 눌러</b> 지워요.</td></tr></table><div class="callout"><b>여러 개 학습하기</b> 기능 버튼을 길게 누르고 → <b>Learn Multiple</b>을 켜고 → 저장해요. 그러면 ID 1, ID 2, ID 3…처럼 여러 개를 학습할 수 있어요.</div>'},
  {h:'직접 눌러 보는 허스키렌즈',b:'<p>진짜처럼 눌러 볼 수 있는 연습용 허스키렌즈예요. 순서대로 해 보세요.</p><ol class="steps small"><li>기능 버튼을 돌려 <b>얼굴 인식</b>을 골라요.</li><li>"보여 줄 것"에서 <b>할머니 얼굴</b>을 골라요.</li><li><b>학습 버튼</b>을 눌러요. ID 1이 붙어요.</li><li>여러 명을 학습하려면 기능 버튼을 <b>길게 눌러</b> 여러 개 학습을 켜요.</li></ol>',w:'husky'},
  {h:'학습을 잘 시키는 요령',b:'<ul class="bul"><li>학습할 대상을 화면 <b>가운데 네모</b>에 맞춰요.</li><li><b>여러 각도, 여러 거리</b>에서 학습시켜요.</li><li><b>대회장 조명</b>에서 다시 학습시켜요. 특히 색상 인식!</li><li><b>ID 번호를 메모</b>해요. (예: ID 1 = 할머니, ID 2 = 엄마) 코드에서 번호를 쓰기 때문이에요.</li><li>잘못 학습했으면 학습 버튼을 <b>두 번 눌러 지우고</b> 다시 해요.</li></ul>'},
  {h:'대회 전에 초기화해요',b:'<p>대회에는 <b>처음 상태</b>로 가져가야 해요. 선생님과 함께 해요.</p><ol class="steps"><li>기능 버튼을 돌려 <b>General Settings</b>(일반 설정)로 가요.</li><li>기능 버튼을 눌러 안으로 들어가요.</li><li><b>Factory Reset</b>(공장 초기화)을 찾아 선택해요.</li></ol><div class="callout warn">허스키렌즈 뒷면의 <b>microSD 카드</b>도 빼야 해요. 초기화하면 학습한 내용이 모두 지워지고 되돌릴 수 없어요.</div>',t:'허스키렌즈로 내 얼굴을 학습시키고, 친구 얼굴을 ID 2로 학습시켜 봐요. 화면에 ID가 어떻게 보이는지 확인해요.'}
 ],quiz:[
  {q:'허스키렌즈 케이블은 어디에 먼저 꽂을까요?',o:['허스키렌즈','허브','노트북','아무 데나'],a:0,e:'허스키렌즈에 먼저 꽂고, 반대쪽을 허브 포트에 꽂아요.'},
  {q:'학습 버튼을 두 번 누르면?',o:['학습한 것이 지워진다','학습이 두 번 된다','전원이 꺼진다','기능이 바뀐다'],a:0,e:'짧게 누르면 학습, 두 번 누르면 지우기예요.'},
  {q:'여러 사람 얼굴을 ID 1, ID 2로 학습하려면?',o:['기능 버튼을 길게 눌러 Learn Multiple을 켠다','학습 버튼을 세 번 누른다','허브를 다시 켠다','카메라를 가린다'],a:0,e:'Learn Multiple(여러 개 학습)을 켜야 해요.'},
  {q:'스파이크 앱에서 허스키렌즈는 무엇으로 표시될까요? (연수 자료 기준)',o:['컬러 센서','거리 센서','모터','힘 센서'],a:0,e:'대회 연수 자료에 컬러 센서로 표시된다고 나와 있어요.'}
 ]},
 {id:'l8',n:8,t:'허스키렌즈 9가지 기능',min:15,goal:'9가지 AI 기능이 무엇을 알아보는지, 소주제에 어떻게 쓰는지 알아요.',cards:[
  {h:'9가지 기능 한눈에 보기',b:'<p>기능 버튼을 돌리면 9가지 기능을 고를 수 있어요. 카드를 눌러 자세히 보세요.</p><p class="small">소주제 안내 자료에는 "객체"를 "사물"이라고 쓴 곳도 있어요. 같은 뜻이에요.</p>',w:'husky9'},
  {h:'바로 쓰는 기능, 학습이 필요한 기능',b:'<div class="duo"><div><b>바로 쓸 수 있어요</b><span><b>객체 인식</b>은 사람, 자동차, 자전거, 개, 고양이, 병, 의자 등 미리 배운 20가지를 바로 알아봐요.</span></div><div><b>우리가 학습시켜요</b><span>얼굴 인식, 객체 추적, 색상 인식, 태그 인식, 객체 분류, 라인 추적, 바코드, QR코드는 우리가 학습 버튼으로 가르쳐요.</span></div></div>'},
  {h:'허스키렌즈가 알려 주는 정보',b:'<ul class="bul"><li><b>무엇인지</b>: ID 번호 (ID 1 = 할머니, ID 2 = 엄마)</li><li><b>어디에 있는지</b>: 화면 속 위치. 왼쪽에 있을수록 X 값이 작고, 오른쪽일수록 커요.</li><li><b>얼마나 가까운지</b>: 가까이 있을수록 네모가 커져요.</li><li><b>선의 방향</b>: 라인 추적에서는 선이 어느 쪽으로 가는지 알려 줘요.</li></ul><p>이 정보를 코드의 <b>"만약"</b> 블록에 넣어서 로봇을 움직여요.</p>'},
  {h:'소주제별 추천 기능 (대회 안내 자료)',b:'',w:'topicai'},
  {h:'기능 고르기 연습',b:'<p>상황을 읽고 알맞은 기능을 골라 보세요.</p>',w:'pickfn'}
 ],quiz:[
  {q:'학습하지 않아도 사람과 자동차를 알아보는 기능은?',o:['객체 인식','객체 추적','색상 인식','태그 인식'],a:0,e:'객체 인식은 미리 배운 20가지 물체를 알아봐요.'},
  {q:'캔, 페트병, 종이를 종류별로 나누려면?',o:['객체 분류','라인 추적','얼굴 인식','바코드 인식'],a:0,e:'객체 분류는 여러 장면을 학습해 종류를 나눠요.'},

  {h:'해커톤 = 코딩계의 흑백요리사',img:[['life4','레고 스파이크로 함께 만드는 모습']],b:'<p>"흑백요리사" 본 적 있나요? 요리사들이 <b>정해진 시간</b> 안에, <b>주어진 재료</b>로, 그날 나온 <b>미션 주제</b>에 맞는 요리를 만들어요. 그리고 심사위원 앞에서 "왜 이렇게 만들었는지" 설명하죠.</p><p><b>해커톤</b>은 코딩으로 하는 흑백요리사예요. 요리 대신 <b>로봇</b>을 만들어요.</p><div class="map3"><div><b>흑백요리사</b><span>재료: 주어진 식재료</span><span>미션: 그날 공개되는 주제</span><span>심사: 맛 + 요리 설명</span></div><div class="arrow">→</div><div><b>우리 해커톤</b><span>재료: 레고 스파이크 + 허스키렌즈</span><span>미션: 대회 날 뽑는 소주제</span><span>심사: 작품 + 계획서 + 발표</span></div></div><p>해커톤은 해킹(hack)과 마라톤(marathon)을 합친 말이에요. 오랜 시간 동안 팀이 함께 문제를 해결해요.</p>'},
  {h:'우리 대회의 대주제',b:'<div class="banner"><span>대주제</span><b>미래 사회 솔루션</b><em>AI로 상상하고, 코딩으로 완성하라</em></div><p>어려워 보이지만, 풀어 보면 이런 뜻이에요.</p><p style="font-size:1.12rem;line-height:1.9">"앞으로 우리 동네와 사회에는 어떤 불편한 일이 생길까? 그 문제를 <b>똑똑한 카메라(허스키렌즈)</b>가 알아보게 하고, <b>레고 로봇</b>이 직접 움직여서 해결해 보자!"</p><p>예를 들어 볼게요. 학교 앞 횡단보도에서 동생들이 신호를 안 보고 뛰어든다면? 허스키렌즈가 "아이가 있다!"를 알아보고, 레고로 만든 차단봉이 내려와 차를 막을 수 있겠죠. 이렇게 <b>문제를 찾고 → 카메라가 알아보고 → 로봇이 움직이는 것</b>, 이게 우리가 대회에서 할 일이에요.</p><div class="note">한 줄로 기억해요: <b>"AI 카메라로 보고, 레고 로봇으로 해결한다!"</b></div>'},

function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function dayOf(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay()}
function dlabel(s){if(!s)return '';const [,m,d]=s.split('-').map(Number);return `${m}/${d}(${WD[dayOf(s)]})`}
function ddiff(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5)}
let AC=null;

function beep(n){if(!AC)return;try{for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;const t=AC.currentTime+i*.35;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.28)}}catch(e){}}
function chime(){if(!AC)return;try{[523,659,784,1047].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.32)})}catch(e){}}

const TERM_KEYS=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
function annotate(root){if(!root||['tplan','tset'].includes(VIEW))return;const used=new Set();const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('textarea,input,select,button,option,.term,script,style,svg,.chip,.tag,a,.blk,.dots,label.f>span.h'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const k of TERM_KEYS){if(used.has(k))continue;for(const n of nodes){if(!n.parentNode)continue;const i=n.nodeValue.indexOf(k);if(i<0)continue;const prev=TERM_KEYS.find(o=>o!==k&&o.includes(k)&&n.nodeValue.includes(o));if(prev&&n.nodeValue.indexOf(prev)<=i&&n.nodeValue.indexOf(prev)+prev.length>i)continue;
   const after=n.splitText(i);after.splitText(k.length);const sp=document.createElement('span');sp.className='term';sp.tabIndex=0;sp.dataset.term=k;sp.textContent=k;after.parentNode.replaceChild(sp,after);nodes.push(sp.nextSibling);used.add(k);break}}}
function showTerm(k){const t=TERMS[k];if(!t)return;const p=$('#termPop');p.innerHTML=`<div class="tp-in">${t[1]&&IMG[t[1]]?`<img src="${IMG[t[1]]}" alt="">`:''}<div><b>${esc(k)}</b><p>${esc(t[0])}</p></div><button class="btn sm" data-tclose="1" aria-label="닫기">닫기</button></div>`;p.hidden=false}
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(t){showTerm(t.dataset.term);return}if(e.target.closest('[data-tclose]')||!e.target.closest('#termPop'))$('#termPop').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('term'))showTerm(e.target.dataset.term);if(e.key==='Escape')$('#termPop').hidden=true});
